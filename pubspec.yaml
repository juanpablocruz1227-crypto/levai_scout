name: levai_scout
description: >
  Levai Scout — Chatbot de Pesquisa Avançada Local e Gratuito.
  Alternativa 100% offline ao Google Search, combinando SearXNG,
  Web Scraping headless via Chromium (puppeteer) e um LLM local
  (Qwen2.5-Coder via Ollama) para sintetizar respostas factuais
  citando as fontes consultadas.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  http: ^1.2.2
  puppeteer: ^3.16.0
  html: ^0.15.4
  markdown: ^7.2.2
  meta: ^1.15.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.8
